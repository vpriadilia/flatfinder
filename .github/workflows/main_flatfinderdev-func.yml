# Builds a container image (bundling the Chromium binary + its native OS deps, since
# Playwright can't run on Flex Consumption's managed runtime), pushes it to Azure Container
# Registry, and redeploys the infra so the Function App (hosted on Azure Container Apps) picks
# up the new image tag.
#
# Requires these repo secrets (federated/OIDC login, no client secret needed):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# See: https://github.com/Azure/login#login-with-openid-connect-oidc-recommended

name: Build and deploy container to Azure Function App - flatfinderdev-func

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FUNCTIONAPP_PROJECT_PATH: 'funcs'
  RESOURCE_GROUP: 'flatfinder-dev-rg'
  CONTAINER_REGISTRY_NAME: 'flatfinderdevacr'
  CONTAINER_REGISTRY_LOGIN_SERVER: 'flatfinderdevacr.azurecr.io'
  IMAGE_NAME: 'flatfinder-func'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v7

      - name: 'Azure login (OIDC)'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Log in to Azure Container Registry'
        run: az acr login --name ${{ env.CONTAINER_REGISTRY_NAME }}

      - name: 'Build and push container image'
        run: |
          docker build \
            --tag ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.FUNCTIONAPP_PROJECT_PATH }}
          docker push ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: 'Deploy infra and point the Function App at the new image'
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters imageTag=${{ github.sha }}
